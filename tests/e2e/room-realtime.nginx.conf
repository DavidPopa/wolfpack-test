events {}

http {
  server {
    listen 8080;
    server_name _;

    location /socket.io/ {
      proxy_pass http://host.docker.internal:4108;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }

    location /api/ {
      proxy_pass http://host.docker.internal:4108;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /__fixture/ {
      proxy_pass http://host.docker.internal:4108;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://host.docker.internal:3108;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
