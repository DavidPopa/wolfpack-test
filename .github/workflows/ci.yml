name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm services:test:up
      - run: pnpm db:validate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:api:unit
      - run: pnpm test:api:integration
      - run: pnpm test:web
      - run: pnpm build
      - run: pnpm stack:up
      - run: pnpm test:e2e
      - run: pnpm test:tooling
      - run: pnpm hooks:check
      - name: Upload sanitized browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop owned services without deleting volumes
        if: always()
        run: |
          pnpm stack:stop || true
          pnpm services:test:stop || true
