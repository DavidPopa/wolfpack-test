server {
  listen 8080;
  server_name _;

    location /socket.io/ {
      proxy_pass http://realtime-fixture:${ROOM_REALTIME_FIXTURE_PORT};
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }

    location /api/ {
      proxy_pass http://realtime-fixture:${ROOM_REALTIME_FIXTURE_PORT};
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /__fixture/ {
      proxy_pass http://realtime-fixture:${ROOM_REALTIME_FIXTURE_PORT};
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://realtime-web:${ROOM_REALTIME_WEB_PORT};
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
}
